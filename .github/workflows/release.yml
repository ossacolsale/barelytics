name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to rebuild and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      # Release tooling comes from the current default branch, so a fixed
      # workflow/validator can rebuild a tag whose own commit predates the fix.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: release-tools
      - name: Resolve and validate requested tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer tag such as v1.2.3 or v1.2.3-rc.1; got $RELEASE_TAG" >&2
            exit 1
          fi
          git -C release-tools fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit=$(git -C release-tools rev-parse --verify "$RELEASE_TAG^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.commit }}
          path: tagged-source
      - name: Test current release tooling
        run: python3 -m unittest discover -s release-tools/scripts -p 'test_*.py' -v
      - name: Validate package versions at tagged commit
        run: python3 release-tools/scripts/validate_release_versions.py '${{ steps.resolve.outputs.tag }}' tagged-source

  php:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Syntax checks
        run: find public/barelytics integrations/wordpress scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Regression checks
        run: php tests/run.php
      - name: HTTP integration checks
        run: bash tests/integration.sh
      - name: Build installable archives
        if: matrix.php == '8.5'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          mkdir -p release-assets
          (cd public && zip -qr "$GITHUB_WORKSPACE/release-assets/barelytics-php-${RELEASE_TAG}.zip" barelytics)
          php scripts/build-wordpress-plugin.php
          cp build/barelytics-wordpress.zip "release-assets/barelytics-wordpress-${RELEASE_TAG}.zip"
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.5'
        with:
          name: release-php
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

  node:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: packages/node
      - name: Build npm archive
        if: matrix.node == '22'
        run: npm pack
        working-directory: packages/node
      - uses: actions/upload-artifact@v7
        if: matrix.node == '22'
        with:
          name: release-node
          path: packages/node/*.tgz
          if-no-files-found: error
          retention-days: 7

  python:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s test -v
        working-directory: packages/python
      - name: Build Python distributions
        if: matrix.python == '3.11'
        run: python -m pip install build && python -m build
        working-directory: packages/python
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.11'
        with:
          name: release-python
          path: packages/python/dist/*
          if-no-files-found: error
          retention-days: 7

  dotnet:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project test/Barelytics.ContractTests --framework net10.0
        working-directory: packages/dotnet
      - run: dotnet pack Barelytics/Barelytics.csproj --configuration Release --output artifacts
        working-directory: packages/dotnet
      - uses: actions/upload-artifact@v7
        with:
          name: release-dotnet
          path: packages/dotnet/artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  java:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: packages/java/pom.xml
      - run: mvn --batch-mode test
        working-directory: packages/java
      - name: Assemble Java distribution
        if: matrix.java == '21'
        run: |
          mvn --batch-mode package -DskipTests
          mkdir -p release-assets
          cp target/barelytics-java-*.jar release-assets/
          cp pom.xml release-assets/barelytics-java.pom
        working-directory: packages/java
      - uses: actions/upload-artifact@v7
        if: matrix.java == '21'
        with:
          name: release-java
          path: packages/java/release-assets/*
          if-no-files-found: error
          retention-days: 7

  ruby:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - run: sh scripts/stage-admin-ui.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec ruby -Ilib test/test_barelytics.rb
        working-directory: packages/ruby
      - name: Build Ruby gem
        if: matrix.ruby == '3.3'
        run: gem build barelytics.gemspec
        working-directory: packages/ruby
      - uses: actions/upload-artifact@v7
        if: matrix.ruby == '3.3'
        with:
          name: release-ruby
          path: packages/ruby/*.gem
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, php, node, python, dotnet, java, ruby]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: release-tools
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate release packages
        run: python3 release-tools/scripts/validate_release_assets.py release-assets
      - name: Generate checksums
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          cd release-assets
          LC_ALL=C sha256sum * > SHA256SUMS.txt
      - name: Create or safely resume GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: bash scripts/publish_github_release.sh "$RELEASE_TAG" "$RELEASE_COMMIT" ../release-assets
        working-directory: release-tools
