name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Syntax checks
        run: find public/barelytics -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Regression checks
        run: php tests/run.php
      - name: HTTP integration checks
        run: bash tests/integration.sh

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: packages/node
      - run: npm pack
        working-directory: packages/node
      - uses: actions/upload-artifact@v7
        with:
          name: barelytics-node-${{ matrix.node }}
          path: packages/node/*.tgz

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s test -v
        working-directory: packages/python
      - name: Test release archive validation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python -m pip install build && python -m build
        working-directory: packages/python
      - uses: actions/upload-artifact@v7
        with:
          name: barelytics-python-${{ matrix.python }}
          path: packages/python/dist/*

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project test/Barelytics.ContractTests --framework net10.0
        working-directory: packages/dotnet
      - run: dotnet pack Barelytics/Barelytics.csproj --configuration Release --output artifacts
        working-directory: packages/dotnet
      - uses: actions/upload-artifact@v7
        with:
          name: barelytics-dotnet
          path: packages/dotnet/artifacts/*.nupkg

  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/stage-admin-ui.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: packages/java/pom.xml
      - run: mvn --batch-mode test
        working-directory: packages/java
      - run: mvn --batch-mode package -DskipTests
        working-directory: packages/java
      - uses: actions/upload-artifact@v7
        with:
          name: barelytics-java-${{ matrix.java }}
          path: packages/java/target/*.jar

  ruby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/stage-admin-ui.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec ruby -Ilib test/test_barelytics.rb
        working-directory: packages/ruby
      - run: gem build barelytics.gemspec
        working-directory: packages/ruby
      - uses: actions/upload-artifact@v7
        with:
          name: barelytics-ruby-${{ matrix.ruby }}
          path: packages/ruby/*.gem

  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: PHP syntax checks
        run: find integrations/wordpress scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build installable plugin ZIP
        run: php scripts/build-wordpress-plugin.php
      - name: Validate ZIP contents
        run: unzip -l build/barelytics-wordpress.zip | grep -E 'barelytics/barelytics-core/(admin.php|src/Barelytics.php)'
      - uses: actions/upload-artifact@v7
        with:
          name: barelytics-wordpress-plugin
          path: build/barelytics-wordpress.zip
